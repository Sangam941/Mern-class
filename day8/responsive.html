<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>responsive in css</title>

    <style>
        .container{
            height: 80vh;
            width: 100%;
            border: 2px solid black;
            /* background-color: red; */
            display: flex;
            gap: 10px;
        }

        .box{
            height: 100px;
            width: 100px;
            background-color: red;
        }

        @media screen and (max-width:500px) {
            .container{
                /* background-color: blue;
                 */

                 flex-direction: column;
            }
        }

        @media screen and (max-width:700px) {
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
