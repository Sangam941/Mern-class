<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- <link rel="stylesheet" href="style.css"> -->

    <style>

        /* element selectors */
        /* p{
            color: rgb(108, 199, 149);
            background-color: rgb(209, 113, 201);
        } */

        div{
            color: blue;
        }

        h1{
            color: green;
        }

        body{
            text-align: center;
        }

/* class selector */
        .red:hover{
            color: red;
        }
        .purple{
            color: red;
        }


    /* id selector */
        #hello{
            color: yellow;
        }

    /* universal selector */
/* 
    *{
        background-color: green;
        color: white;
    } */


    /* pseudo selector */
        a:link{
            color: green;
        }

        a:visited{
            color: red;
        }

        a:hover{
            color: black;
        }
    

    </style>
</head>
<body>

    <!-- css- cascading style sheet
     
        1. inline css
        2. internal css
        3. external css
    
    -->

    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Neque pariatur deleniti error.</p>
    <h1 class="red">i am heading 1</h1>
    <div>hello i am a div</div>
    <p>hello this is css class</p>


    <p class="purple">Lorem ipsum dolor sit amet.</p>
    <p class="purple">Lorem ipsum dolor sit amet.</p>
    <p class="purple">Lorem ipsum dolor sit amet.</p>
    <p id="hello">Lorem ipsum dolor sit amet.</p>
    <p>Lorem ipsum dolor sit amet.</p>

    <a href="https://www.google.com">Google</a>
</body>
</html>
