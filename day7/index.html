<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            height: 80vh;
            width: 100%;
            border: 2px solid black;
            display: grid;
            grid-template-rows: 60px;
            grid-template-columns: repeat(3,60px);
        }

        .box {
            height: 50px;
            width: 50px;
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
