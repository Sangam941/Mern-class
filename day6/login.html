<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="heading">
            <h3>Welcome to LMS!</h3>
            <h1>Login to Your Account</h1>
        </div>

        <div class="form">
            <div class="email">
                <label for="email">Email Address</label>
                <input class="input" type="text" name="email" id="email" placeholder="Enter your email">
            </div>

            <div class="password">
                <div class="pass">
                    <label for="password">Password</label>

                    <div class="forget">Forget Password</div>
                </div>
                <input class="input" type="password" name="password" id="password" placeholder="Enter your Password">
            </div>

            <div class="remember">
                <input type="checkbox" name="checkbox" id="checkbox">
                <label for="checkbox">Remember Me</label>
            </div>

            <div class="btn">
                <button type="submit">Login</button>
            </div>

            <p>
                Don't have an account? <span><a href="#">Create Account</a></span>
            </p>
        </div>
    </div>
</body>

</html>
