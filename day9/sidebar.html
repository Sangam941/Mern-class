<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sidebar in website</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            height: 100vh;
            width: 100%;
        }

        .sidebar{
            height: 100vh;
            border: 2px solid red;
            width: 200px;
            background-color: aqua;
            transform: translate(-100%);
            transition: transform 0.3s linear;
        }

        input{
            display: none;
        }
      
        #checkbox:checked ~ .sidebar{
            transform: translate(0%);
            
        }
        #checkbox:checked ~ #hamburger{
            display: none;

        }
        
    </style>
</head>
<body>
    <div class="container">

        <input type="checkbox" id="checkbox">

        <label for="checkbox" id="hamburger">humburger</label>
        
        <div class="sidebar">
            <label for="checkbox">X</label>

            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </div>
    </div>
</body>
</html>
