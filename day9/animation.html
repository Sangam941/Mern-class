<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation in css</title>

    <style>
        .container{
            width: 100%;
            height: 100vh;
            border: 2px solid black;
            display: flex;
            align-items: end;
        }

        .box{
            height: 100px;
            width: 100px;
            border-radius: 50%;
            background-color: green;
            animation: hello 2s linear 1s infinite alternate;

            /* animation-name: slider;
            animation-timing-function: ease-in-out;
            animation-duration: 2s;
            animation-iteration-count: infinite; */
            /* animation-play-state: running; */
            /* animation-direction:alternate; */
            /* animation-fill-mode: forwards; */
            /* animation-delay: 1s; */

        }

        @keyframes slider {
            from{
                transform: translateX(0px) translateY(-0px);
            }
            to{
                /* transform: rotate(360deg); */
                /* transform: translateX(500px) rotate(360deg);
                 */

                 transform: translateX(1000px) translateY(-300px);
            }
        }

        @keyframes hello {
            0%{
                transform: translate();
            }
            25%{
                transform: translateX(200px) translateY(-600px);
            }
            40%{
                transform: translateX(400px) translateY(0px);
            }
            60%{
                transform: translateX(600px) translateY(-600px);
            }
            80%{
                transform: translateX(800px) translateY(0px);
            }
            100%{
                transform: translateX(1000px) translateY(-600px);
            }
            
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
