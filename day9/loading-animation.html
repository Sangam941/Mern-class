<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>laoding animation</title>

    <style>
        .container{
            height: 100vh;
            width: 100%;
        }
        .box{
            height: 60px;
            width: 60px;
            border: 5px solid red;
            border-right: 7px solid white;
            /* background-color: green; */
            border-radius: 50%;
            animation: loader 0.3s linear infinite;

        }

        @keyframes loader {
            from{

            }
            to{
                transform: rotate(360deg);
            }
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
