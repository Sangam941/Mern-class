<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            height: 100vh;
            width: 100%;
            border: 2px solid black;
        }
        .sidebar{
            transition: transform 0.3s ease-in-out;
            transform: translateX(-100%);
            border: 2px solid green;
            height: 100vh;
            width: 200px;
        }
        #checkbox:checked ~ .sidebar{
            transform: translateX(0%);
        }
    </style>
</head>
<body>
    <div class="container">
        <input style="display: none;" type="checkbox" id="checkbox">

        <label for="checkbox">ham</label>

        <div class="sidebar">
            <label for="checkbox">x</label>
            <nav>
                <ul>
                    <li>
                        home
                    </li>
                    <li>about</li>
                    <li>contact</li>
                </ul>
            </nav>
        </div>
    </div>
</body>
</html>
