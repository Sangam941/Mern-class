<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sibling ~</title>
    <style>
        .box{
            height: 30px;
            width: 30px;
            background-color: red;
            margin: 5px;
        }

        .box1 ~ .box2{
            background-color: green;
        }

    </style>
</head>
<body>
    <div class="box box1"></div>
    <div class="box box2"></div>
</body>
</html>
